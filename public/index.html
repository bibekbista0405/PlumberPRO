<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme Color (matches the app's brand teal, used by mobile browser chrome and PWA installs) -->
    <meta name="theme-color" content="#0f6659" />

    <!-- iOS "add to home screen" behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlumbPro" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="PlumbPro connects you with verified, available plumbers near you. Search by location, compare real reviews, and book a trusted plumber in minutes."
    />
    <meta name="author" content="PlumbPro" />

    <!-- Apple Devices -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts are loaded via @import in src/index.css (Space Grotesk, Inter,
         IBM Plex Mono) so the whole design system stays in one place.
         Preconnecting here warms up the connection before that CSS parses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Title -->
    <title>PlumbPro | Book a Trusted Plumber Near You</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use the PlumbPro application.
    </noscript>

    <!-- React Root -->
    <div id="root"></div>
  </body>
</html>
